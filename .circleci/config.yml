version: 2.1
jobs:
  build:
    docker:
      # image with node, npm and yarn installed
      - image: cimg/node:18.16.1-browsers
        auth:
          username: $DOCKER_HUB_USERNAME
          password: $DOCKER_HUB_PASSWORD
    resource_class: large
    steps:
      # checkout workspace to repo code
      - checkout

      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "yarn.lock" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run:
          name: yarn install
          command: yarn install --frozen-lockfile --network-concurrency 1 --ignore-engines

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "yarn.lock" }}

      - run:
          name: build ReactJS project
          command: |
            if [ "${CIRCLE_BRANCH}" = "master" ]; then
              echo 'ESKIMI_ID=31136' >> .env
              echo 'REACT_APP_GA_MEASUREMENT_ID=GTM-MBRQRCW' >> .env
              echo 'REACT_APP_STATSIG_KEY=${REACT_APP_STATSIG_KEY_PROD}' >> .env
              echo 'REACT_APP_STATSIG_URL=${REACT_APP_STATSIG_URL_PROD}' >> .env
            fi
            if [ "${CIRCLE_BRANCH}" = "staging" ]; then
              echo 'REACT_APP_STATSIG_KEY=${REACT_APP_STATSIG_KEY_STAGING}' >> .env
            fi
            yarn build

      - persist_to_workspace:
          root: .
          paths:
            - build
            - scripts/ci/deploy-gcs.sh

  deploy:
    docker:
      # Reviewed CircleCI GCP image; deployment needs no stored cloud key.
      - image: cimg/gcp@sha256:d2dca4da0c46ab4aa0760d14b9260229a40b75ec9842136201ab63af99686526
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Authenticate to GCP with branch-scoped workload identity
          command: |
            set -euo pipefail
            : "${CIRCLE_OIDC_TOKEN_V3:?CircleCI OIDC token is unavailable}"
            case "${CIRCLE_BRANCH}" in
              master|staging) ;;
              *) printf >&2 'Unsupported deployment branch: %s\n' "${CIRCLE_BRANCH}"; exit 1 ;;
            esac

            umask 077
            oidc_token_path="${HOME}/circleci-oidc-token"
            gcp_creds_path="${HOME}/gcp-creds.json"
            provider="projects/290730833389/locations/global/workloadIdentityPools/circleci-demex-website-${CIRCLE_BRANCH}/providers/circleci-demex-website-${CIRCLE_BRANCH}"
            service_account="demex-website-${CIRCLE_BRANCH}-ci@cloud-nodes-372902.iam.gserviceaccount.com"
            printf '%s' "${CIRCLE_OIDC_TOKEN_V3}" > "${oidc_token_path}"
            gcloud iam workload-identity-pools create-cred-config \
              "${provider}" \
              --service-account="${service_account}" \
              --credential-source-file="${oidc_token_path}" \
              --output-file="${gcp_creds_path}"
            export GOOGLE_APPLICATION_CREDENTIALS="${gcp_creds_path}"
            printf "export GOOGLE_APPLICATION_CREDENTIALS='%s'\n" "${gcp_creds_path}" >> "${BASH_ENV}"
            gcloud auth login --quiet --cred-file="${gcp_creds_path}"
            gcloud config set project cloud-nodes-372902
      - run:
          name: Deploy the validated build to Google
          command: bash scripts/ci/deploy-gcs.sh


workflows:
  deploy-project:
    jobs:
      - build:
          context: org-switcheo
          filters:
            branches:
              only:
                - master
                - staging
      - deploy:
          requires:
            - build
